<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: system-ui, sans-serif; fill: #1a1a1a; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #555; }
    .arr { stroke: #888; stroke-width: 1.5; fill: none; }
  </style>
</defs>

<!-- Client Layer -->
<rect x="220" y="20" width="240" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="37" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Client / API layer</text>
<text class="ts" x="340" y="54" text-anchor="middle" dominant-baseline="central" fill="#534AB7">insert, query, delete</text>

<line x1="340" y1="64" x2="340" y2="96" class="arr" marker-end="url(#arrow)"/>

<!-- Query Engine -->
<rect x="190" y="96" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="113" text-anchor="middle" dominant-baseline="central" fill="#085041">Query engine</text>
<text class="ts" x="340" y="130" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">ANN search, filters, ranking</text>

<line x1="340" y1="140" x2="340" y2="172" class="arr" marker-end="url(#arrow)"/>

<!-- Index Layer -->
<rect x="160" y="172" width="360" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="189" text-anchor="middle" dominant-baseline="central" fill="#633806">Index layer</text>
<text class="ts" x="340" y="206" text-anchor="middle" dominant-baseline="central" fill="#854F0B">HNSW / IVF / brute-force</text>

<line x1="260" y1="216" x2="200" y2="260" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="216" x2="340" y2="260" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="216" x2="480" y2="260" class="arr" marker-end="url(#arrow)"/>

<!-- Vector Store -->
<rect x="40" y="260" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="130" y="280" text-anchor="middle" dominant-baseline="central" fill="#712B13">Vector store</text>
<text class="ts" x="130" y="298" text-anchor="middle" dominant-baseline="central" fill="#993C1D">float32 arrays, SIMD ops</text>

<!-- Metadata Store -->
<rect x="250" y="260" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="280" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Metadata store</text>
<text class="ts" x="340" y="298" text-anchor="middle" dominant-baseline="central" fill="#185FA5">IDs, payloads, filters</text>

<!-- WAL / Persistence -->
<rect x="460" y="260" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="550" y="280" text-anchor="middle" dominant-baseline="central" fill="#444441">WAL / persistence</text>
<text class="ts" x="550" y="298" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">crash recovery, segments</text>

<line x1="130" y1="316" x2="200" y2="368" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="316" x2="340" y2="368" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="316" x2="480" y2="368" class="arr" marker-end="url(#arrow)"/>

<!-- Memory Manager -->
<rect x="160" y="368" width="360" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="340" y="385" text-anchor="middle" dominant-baseline="central" fill="#27500A">Memory manager</text>
<text class="ts" x="340" y="402" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">arenas, mmap, buffer pools</text>

<line x1="340" y1="412" x2="340" y2="444" class="arr" marker-end="url(#arrow)"/>

<!-- Disk -->
<rect x="220" y="444" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="461" text-anchor="middle" dominant-baseline="central" fill="#444441">Disk / segment files</text>
<text class="ts" x="340" y="478" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">binary layout, mmap reads</text>
</svg>
